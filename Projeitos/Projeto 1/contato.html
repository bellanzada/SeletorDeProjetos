<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato - Cuidados Com Animais no Verão</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .secao-contato {
      padding: 60px 20px;
      text-align: center;
      background-color: #ffffff;
    }

    .container-contato {
      max-width: 400px;
      margin: 30px auto 0 auto;
      padding: 25px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: left;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    .btn-enviar {
      width: 100%;
      background-color: #1d4ed8;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <div class="header-brand">
      <div class="logo-container">
        <img src="wapps.jpg" alt="Logo">
      </div>
      <h1>Cuidados Com Animais no Verão</h1>
    </div>
    <nav class="header-nav">
      <ul>
        <li><a href="Projeto1.html" class="nav-link">INÍCIO</a></li>
        <li><a href="#pagina2" class="nav-link">DICAS</a></li>
        <li><a href="contato.html" class="nav-link active">CONTATO</a></li>

      </ul>
    </nav>
  </header>

  <main>
    <section class="secao-contato">
      <h2>Área de Contato 🐾</h2>
      <p>Insira seus dados para acessar o nosso painel de suporte pet.</p>

      <div class="container-contato">
        <form action="#" method="POST">
          <div class="campo">
            <input type="email" id="email" placeholder="E-mail do Tutor" required>
          </div>

          <div class="campo">
            <input type="password" id="password" placeholder="Senha de Acesso" required>
          </div>

          <button type="submit" class="btn-enviar">Entrar em Contato</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; Site de Cuidados com Pets no Verão. Todos os direitos reservados.</p>
  </footer>

</body>

</html>
